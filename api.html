<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <script>
      function LoadProducts() {
        fetch("https://fakestoreapi.com/products")
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            for (var item of data) {
              var div = document.createElement("div");
              div.className = "card m-2 p-2";
              div.style.width = "200px";
              div.innerHTML = `<img src=${item.image} height="150" class="card-img-top">
                         <div class="card-header" style="height:180px">
                            <p>${item.title}</p>
                         </div>
                         <div class="card-body">
                            <dl>
                                <dt>Price</dt>
                                <dd>${item.price}</dd>
                                <dt>Rating</dt>
                                <dd>
                                    <span class="bi bi-star-fill text-success"></span> ${item.rating.rate}
                                     [${item.rating.count}]
                                </dd>
                            </dl>
                         </div>
                         <div class="card-footer">
                            <button class="btn btn-danger w-100"> <span class="bi bi-cart4"></span> Add to Cart </button>  
                         </div>
                       
                        `;

              document.getElementById("catalog").appendChild(div);
            }
          });
      }
      function LoadCategories() {
        fetch("https://fakestoreapi.com/products/categories")
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            data.unshift("All");
            for (var item of data) {
              var option = document.createElement("option");
              option.text = item.toUpperCase();
              option.value = item;

              document.querySelector("select").appendChild(option);
            }
          });
      }

      function bodyload() {
        LoadProducts();
        LoadCategories();
      }
    </script>
  </head>

  <body onload="bodyload()" class="container-fluid">
    <header class="bg-danger p-2 text-white text-center">
      <h2>Online Shopping</h2>
    </header>
    <div class="row mt-3">
      <div class="col-2">
        <div>
          <label>Select Category</label>
          <div>
            <select class="form-select"></select>
          </div>
        </div>
      </div>
      <div class="col-8">
        <div
          class="d-flex flex-wrap overflow-auto"
          style="height: 500px"
          id="catalog"
        ></div>
      </div>
      <div class="col-2">
        <button class="btn btn-danger w-100">[ ]Your Cart Items</button>
      </div>
    </div>
  </body>
</html>
